name: Sync AGS Definition

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  AGS_REPO: Alfresco/alfresco-enterprise-repo
  AGS_FILE_PATH: amps/ags/rm-enterprise/rm-enterprise-rest-api-explorer/src/main/webapp/definitions/gs-classification-api.yaml
  LOCAL_DEFS_DIR: src/main/webapp/definitions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          owner: Alfresco
          repositories: alfresco-enterprise-repo,rest-api-explorer
          permission-contents: write

      - name: Checkout AGS definition
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.AGS_REPO }}
          ref: master
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: ${{ env.AGS_FILE_PATH }}
          sparse-checkout-cone-mode: false
          path: enterprise-repo

      - name: Copy AGS definition
        run: |
          cp enterprise-repo/${{ env.AGS_FILE_PATH }} ${{ env.LOCAL_DEFS_DIR }}/
          rm -rf enterprise-repo

      - name: Commit AGS definition update
        uses: iarekylew00t/verified-bot-commit@33985d44b7719dcaf0b854a0f4b0caad9bdc5b86 # v2.3.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: master
          files: ${{ env.LOCAL_DEFS_DIR }}/gs-classification-api.yaml
          message: "Sync AGS definition from ${{ env.AGS_REPO }}"
