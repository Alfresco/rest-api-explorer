name: Alfresco REST API Explorer CI

on:
  pull_request:
    branches:
      - master
      - fix/**
      - feature/**
      - release/**
  push:
    branches:
      - master
      - fix/**
      - feature/**
      - release/**
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 3'

env:
  RELEASE_VERSION: "25.5.0"
  DEVELOPMENT_VERSION: "25.6.0-A.1-SNAPSHOT"
  MAVEN_CLI_OPTS: "-B -q -e -fae -V -DinstallAtEnd=true -U"
  GITHUB_ACTIONS_DEPLOY_TIMEOUT: 30

jobs:
  pre_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@3bbbfc459dd15452e68e3cefcbc56596d88d71ee # v19.15.0

  build:
    name: "Build"
    runs-on: ubuntu-latest
    needs: [pre_commit]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@3bbbfc459dd15452e68e3cefcbc56596d88d71ee # v19.15.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@3bbbfc459dd15452e68e3cefcbc56596d88d71ee # v19.15.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@3bbbfc459dd15452e68e3cefcbc56596d88d71ee # v19.15.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Build"
        run: mvn install -DskipTests=true -Dmaven.javadoc.skip=true -B -V
      - name: "Verify"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: mvn ${MAVEN_CLI_OPTS} verify -Dlogging.root.level=off -Dspring.main.banner-mode=off

  tests:
    name: "Integration tests"
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      id-token: write
      contents: read
    if: "!contains(github.event.head_commit.message, '[skip tests]')"
    steps:
      - uses: actions/checkout@v4
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@3bbbfc459dd15452e68e3cefcbc56596d88d71ee # v19.15.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@3bbbfc459dd15452e68e3cefcbc56596d88d71ee # v19.15.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@3bbbfc459dd15452e68e3cefcbc56596d88d71ee # v19.15.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Run tests"
        run: mvn verify

  release:
    name: "Release"
    runs-on: ubuntu-latest
    needs: [tests]
    permissions:
      id-token: write
      contents: write
    if: >
      !(failure() || cancelled()) && contains(github.event.head_commit.message, '[release]') &&
      github.ref_name == 'release/25.N' && github.event_name != 'pull_request'
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@3bbbfc459dd15452e68e3cefcbc56596d88d71ee # v19.15.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@3bbbfc459dd15452e68e3cefcbc56596d88d71ee # v19.15.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@3bbbfc459dd15452e68e3cefcbc56596d88d71ee # v19.15.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Release"
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-release-slim@3bbbfc459dd15452e68e3cefcbc56596d88d71ee # v19.15.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-version: ${{ env.RELEASE_VERSION }}
          development-version: ${{ env.DEVELOPMENT_VERSION }}
