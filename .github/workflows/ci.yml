name: Alfresco REST API Explorer CI

on:
  pull_request:
    branches:
      - master
      - fix/**
      - feature/**
  push:
    branches:
      - master
      - fix/**
      - feature/**
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 3'

env:
  JAVA_VERSION: '21'
  MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
  MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
  RELEASE_VERSION: "26.3.0-A.2"
  DEVELOPMENT_VERSION: "26.3.0-A.3-SNAPSHOT"
  MAVEN_CLI_OPTS: "-B -q -e -fae -V -DinstallAtEnd=true -U"
  GITHUB_ACTIONS_DEPLOY_TIMEOUT: 30

jobs:
  pre_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@v8.16.0

  build:
    name: "Build"
    runs-on: ubuntu-latest
    needs: [pre_commit]
    steps:
      - uses: actions/checkout@v4
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v8.16.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v8.16.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Build"
        run: mvn install -DskipTests=true -Dmaven.javadoc.skip=true -B -V
      - name: "Verify"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: mvn ${MAVEN_CLI_OPTS} verify -Dlogging.root.level=off -Dspring.main.banner-mode=off

  tests:
    name: "Integration tests"
    runs-on: ubuntu-latest
    needs: [build]
    if: "!contains(github.event.head_commit.message, '[skip tests]')"
    steps:
      - uses: actions/checkout@v4
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v8.16.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v8.16.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Run tests"
        run: mvn verify

  publish:
    name: "Publish artifacts"
    runs-on: ubuntu-latest
    needs: [tests]
    if: "!(failure() || cancelled()) && github.event_name != 'pull_request'"
    steps:
      - uses: actions/checkout@v4
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v8.16.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v8.16.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Publish"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: mvn ${MAVEN_CLI_OPTS} deploy -DskipTests

  release:
    name: "Release"
    runs-on: ubuntu-latest
    needs: [publish]
    if: >
      !(failure() || cancelled()) && contains(github.event.head_commit.message, '[release]') &&
      github.ref_name == 'master' && github.event_name != 'pull_request'
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v8.16.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v8.16.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Release"
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-release-slim@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-version: ${{ env.RELEASE_VERSION }}
          development-version: ${{ env.DEVELOPMENT_VERSION }}
